name: Build PhoneFixer for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poco_cleaner.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Android Platform-Tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "."
          if (-not (Test-Path "platform-tools/adb.exe")) { throw "ADB was not found in the downloaded Platform-Tools archive." }

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PhoneFixer
          --add-binary "platform-tools\adb.exe;platform-tools"
          --add-binary "platform-tools\AdbWinApi.dll;platform-tools"
          --add-binary "platform-tools\AdbWinUsbApi.dll;platform-tools"
          poco_cleaner.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PhoneFixer-Windows
          path: dist/PhoneFixer.exe
          if-no-files-found: error
          retention-days: 14
